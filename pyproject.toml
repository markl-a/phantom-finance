[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-finance"
version = "0.1.0a0"
description = "Personal finance tracker for phantom-mesh: ledger, budgets, shame-free reports."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Mark Lai" }]
dependencies = ["mcp>=1,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/markl-a/phantom-finance"
Documentation = "https://github.com/markl-a/phantom-finance/tree/main/docs"
Issues = "https://github.com/markl-a/phantom-finance/issues"
Source = "https://github.com/markl-a/phantom-finance"

[project.scripts]
phantom-finance = "phantom_finance.cli:main"
phantom-finance-mcp = "phantom_finance.mcp_server:main"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["phantom_finance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
